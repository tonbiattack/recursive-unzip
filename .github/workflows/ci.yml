name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./... -count=1
      - name: Build Windows executable
        run: go build -trimpath -ldflags="-s -w" -o recursive-unzip.exe .\cmd\recursive-unzip
